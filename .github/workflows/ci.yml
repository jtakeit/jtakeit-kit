# The kit's checks: every pull request and every push to main runs the tests
# of both packages and packs both the way `npm publish` would, so a file left
# out of `files` is found here and not by the first site that installs the
# release. One job, named for the ruleset that requires it.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Pack both packages as publish would
        run: |
          npm pack --workspace kit --dry-run 2>&1 | grep -E 'package size|total files'
          npm pack --dry-run 2>&1 | grep -E 'package size|total files'
      - name: A scaffold is laid out from the checkout and builds
        # A slug and a directory, the kit asked of the platform's public
        # kits endpoint, no git — and the kit from this checkout rather
        # than from npm, so the scaffold is tried against the kit it ships with.
        # Contract 2's: the next step (test/a11y.mjs) seeds it in two
        # languages contract 2's way, a document per language under jtk/content.
        run: |
          node bin/jtk.mjs create probe --out /tmp/probe --kit salon --locale en --no-git --contract 2
          cd /tmp/probe && npm install --no-audit --no-fund "$GITHUB_WORKSPACE/kit" && npm run build
      - name: Every kit the platform has, laid out on contract 3, built, judged and linted
        # jtk create's default: each kind of the platform's public kits
        # endpoint with a blog, built, then jtk schema against dist/ and
        # jtkit lint (test/create3.mjs).
        run: JTK_KITS_API=https://api.jtakeit.com node test/create3.mjs
      - name: The scaffold's pages read against WCAG 2.1 AA
        # The probe above, seeded with real content and read in the runner's
        # Chrome by `jtk a11y`, in a light and a dark palette (docs/accessibility.md).
        run: node test/a11y.mjs --site /tmp/probe
